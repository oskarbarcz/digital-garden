name: deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Dispatch deploy event
        run: |
          curl -X POST --fail \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/oskarbarcz/yet-another-blog-attempt/dispatches \
            -d '{"event_type":"deploy-blog","client_payload":{"version":"0.1.0"}}'
