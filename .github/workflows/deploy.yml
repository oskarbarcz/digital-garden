name: deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      BLOG_REPO_URL: oskarbarcz/yet-another-blog-attempt
      BLOG_DEPLOY_EVENT: deploy-blog
      BLOG_VERSION: 0.1.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Dispatch deploy event
        run: |
          curl -X POST --fail \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ env.BLOG_REPO_URL }}/dispatches \
            -d '{"event_type":"${{ env.BLOG_DEPLOY_EVENT }}","client_payload":{"version":"${{ env.BLOG_VERSION }}"}}'
